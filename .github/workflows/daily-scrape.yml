name: Daily Depot Price Scrape

on:
  schedule:
    # Run every day at 06:30 UTC (07:30 WAT)
    - cron: "30 6 * * *"
  workflow_dispatch:  # Allows manual runs from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run depot price scraper
        run: python scripts/scrape_depot.py

      - name: Commit and push new data (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/depot/
          if git diff --staged --quiet; then
            echo "No new data to commit"
          else
            git commit -m "Add depot prices for $(date -u +%Y-%m-%d)"
            git push
          fi
